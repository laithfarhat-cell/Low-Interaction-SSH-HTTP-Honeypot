services:
  honeypot:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "2222:2222"
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./keys:/app/keys
      - ./config.yaml:/app/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
